services:
  - type: web
    name: event-hub-api
    env: node
    buildCommand: cd server && npm install && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: ASGARDEO_JWKS_URI
        sync: false
      - key: ASGARDEO_ISSUER
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
